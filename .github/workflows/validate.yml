name: Validate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: |
          python -m pip install --only-binary=:all: \
            "yamllint==1.38.0" \
            "pathspec==1.1.1" \
            "PyYAML==6.0.3"

      - name: Run yamllint
        run: yamllint .

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          machine="$(uname -m)"
          if [ "${machine}" != "x86_64" ]; then
            echo "This job expects an x86_64 runner." >&2
            exit 1
          fi
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          base="https://github.com/gitleaks/gitleaks/releases/download"
          url="${base}/v${version}/${archive}"
          work="$(mktemp -d)"
          curl --fail --location --silent --show-error \
            --output "${work}/${archive}" \
            "${url}"
          echo "${expected}  ${work}/${archive}" | sha256sum -c -
          tar -xzf "${work}/${archive}" -C "${work}" gitleaks
          install -m 0755 "${work}/gitleaks" "${RUNNER_TEMP}/gitleaks"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          rm -rf "${work}"

      - name: Scan git history
        run: gitleaks git . --redact=100 --no-banner
